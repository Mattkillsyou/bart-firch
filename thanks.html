<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Thanks | Bart Firch</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=Hanken+Grotesk:wght@400;500&display=swap">
<style>
  /* where the contact form lands when the page script never ran: it posted straight to Web3Forms, which sends the visitor here */
  :root{--bg:#0B0B0C;--ink:#EDE8DF;--body:#E4DED3;--muted:#BFB9AE;--accent:#E0A25A;color-scheme:dark}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:1.1875rem;line-height:1.6;min-height:100vh;display:grid;align-content:center;padding:48px clamp(20px,5vw,72px)}
  main{max-width:40rem;display:grid;gap:28px}
  .eyebrow{font-size:.8125rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  h1{margin:0;font-weight:300;font-size:clamp(2.25rem,6vw,4.5rem);line-height:1;letter-spacing:-.03em}
  em{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:300}
  p{margin:0;color:var(--body)}
  a{color:var(--ink);text-underline-offset:4px}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Bart Firch</p>
  <h1>Thanks. <em>That came through.</em></h1>
  <p>I’ll personally review your inquiry and be in touch soon.</p>
  <p><a href="/">Back to the site</a></p>
</main>
</body>
</html>
